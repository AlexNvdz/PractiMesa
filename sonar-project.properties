# SonarQube Cloud by default. Local server: npm run sonar:local
sonar.organization=alexnvdz
sonar.projectKey=AlexNvdz_PractiMesa
sonar.projectName=PractiMesa
# Token goes in SONAR_TOKEN env var / GitHub secret, never in this file.

sonar.sources=apps/api/src,apps/web/src
sonar.tests=apps/api/src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts
# Specs live next to sources; exclude them from sources so they are indexed only as tests.
sonar.exclusions=**/*.spec.ts,**/*.test.ts,**/generated/**,**/node_modules/**,**/dist/**,**/.next/**,**/coverage/**
sonar.coverage.exclusions=**/main.ts,**/*.module.ts,apps/web/**
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info
sonar.sourceEncoding=UTF-8
sonar.qualitygate.wait=true
